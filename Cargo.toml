[package]
name = "iroh-persistent"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Maintain exactly one live Iroh connection to a peer, reconnecting and resolving simultaneous connects deterministically."
repository = "https://github.com/ppetr/iroh-persistent"
homepage = "https://github.com/ppetr/iroh-persistent"
readme = "README.md"
keywords = ["iroh", "quic", "p2p", "networking", "reconnect"]
categories = ["network-programming", "asynchronous"]

[dependencies]
backoff = "0.4"
futures-core = "0.3.31"
futures-util = "0.3.31"
iroh = "0.98.2"
strum = "0.28"
strum_macros = "0.28"
tokio = { version = "1.36", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7.11"
tracing = "0.1"

[dev-dependencies]
ntest = "0.9.4"
test-log = "0.2.17"
tokio = { version = "1.36", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 3 # Optimize dependencies, in particular TLS and Iroh.

[profile.test.package."*"]
opt-level = 3
